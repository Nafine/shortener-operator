{{- if .Values.rbacHelpers.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    labels:
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/name: shortener-operator
    name: shortener-operator-urlshortener-editor-role
rules:
    - apiGroups:
        - shortener.nafine.dev
      resources:
        - urlshorteners
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
    - apiGroups:
        - shortener.nafine.dev
      resources:
        - urlshorteners/status
      verbs:
        - get
{{- end }}
