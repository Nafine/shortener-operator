# This rule is not used by the project shortener-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over shortener.nafine.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: shortener-operator
    app.kubernetes.io/managed-by: kustomize
  name: urlshortener-admin-role
rules:
- apiGroups:
  - shortener.nafine.dev
  resources:
  - urlshorteners
  verbs:
  - '*'
- apiGroups:
  - shortener.nafine.dev
  resources:
  - urlshorteners/status
  verbs:
  - get
