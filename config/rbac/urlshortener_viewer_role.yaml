# This rule is not used by the project shortener-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to shortener.nafine.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: shortener-operator
    app.kubernetes.io/managed-by: kustomize
  name: urlshortener-viewer-role
rules:
- apiGroups:
  - shortener.nafine.dev
  resources:
  - urlshorteners
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - shortener.nafine.dev
  resources:
  - urlshorteners/status
  verbs:
  - get
